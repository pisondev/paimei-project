services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paisen
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: paimei_db
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./paimei-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=paisen
      - DB_PASSWORD=secretpassword
      - DB_NAME=paimei_db
      - DB_PORT=5432
    depends_on:
      - db

