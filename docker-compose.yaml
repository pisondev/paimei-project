services:
  # 1. DATABASE PAIMEI
  paimei-db:
    image: postgres:16-alpine
    container_name: paimei-db-container
    environment:
      POSTGRES_USER: user_paimei
      POSTGRES_PASSWORD: dbpaimei123  
      POSTGRES_DB: paimei_db
    ports:
      - "5435:5432" # PORT BARU
    volumes:
      - ./db-data:/var/lib/postgresql/data

  # 2. BACKEND API (Go Fiber)
  paimei-api:
    build: ./paimei-api
    container_name: paimei-api-container
    restart: always
    ports:
      - "3006:3000" # PORT BARU UNTUK API
    depends_on:
      - paimei-db
    env_file:
      - ./paimei-api/.env

  # 3. WEB (Next.js)
  paimei-web:
    build: ./paimei-web
    container_name: paimei-web-container
    restart: always
    ports:
      - "3008:3000" # PORT BARU UNTUK WEB
    env_file:
      - ./paimei-web/.env.local
